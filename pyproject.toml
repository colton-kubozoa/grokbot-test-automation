[project]
name = "grokbot-test-automation"
version = "0.1.0"
description = "Playwright + pytest POC suite against https://www.kubozoa.com/"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "browser(name): Playwright browser under test (chromium, firefox, webkit)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["tests"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
