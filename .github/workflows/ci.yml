# Stages 2–4: dependency audit, lint/typecheck, unit pytest, and browser site report.
#
# Branch protection (human follow-up after merge):
#   Required check names (exact job `name:` values):
#     - dependency-audit
#     - lint-and-typecheck
#     - test-unit
#   Non-required (leave optional / do not require):
#     - browser-site-report
#
# test-unit runs application unit tests only (no Playwright browsers).
# browser-site-report runs the live-site Playwright suite and uploads
# results/latest.json as artifact browser-test-results (Issue #13 contract).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PYTHON_VERSION: "3.12"

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
            python -m pip install pip-audit
            pip-audit -r requirements.txt
          elif [ -f poetry.lock ]; then
            python -m pip install poetry pip-audit
            poetry install --no-interaction
            poetry run pip-audit
          elif [ -f uv.lock ]; then
            python -m pip install uv pip-audit
            uv sync
            pip-audit
          else
            echo "No requirements.txt, poetry.lock, or uv.lock yet; skipping dependency audit."
          fi

  lint:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    needs: dependency-audit
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff check
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          has_ruff_config=0
          if [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            has_ruff_config=1
          elif [ -f pyproject.toml ] && grep -q '^\[tool\.ruff' pyproject.toml; then
            has_ruff_config=1
          fi
          if [ "$has_ruff_config" -eq 1 ]; then
            python -m pip install ruff
            ruff check .
          else
            echo "No ruff config yet (ruff.toml / .ruff.toml / [tool.ruff]); skipping lint (noop)."
          fi

      - name: Mypy
        run: |
          set -euo pipefail
          has_mypy_config=0
          if [ -f mypy.ini ] || [ -f .mypy.ini ]; then
            has_mypy_config=1
          elif [ -f pyproject.toml ] && grep -q '^\[tool\.mypy' pyproject.toml; then
            has_mypy_config=1
          fi
          if [ "$has_mypy_config" -eq 1 ]; then
            python -m pip install mypy
            if [ -f requirements.txt ]; then
              python -m pip install -r requirements.txt
            fi
            mypy .
          else
            echo "No mypy config yet (mypy.ini / .mypy.ini / [tool.mypy]); skipping typecheck (noop)."
          fi

  test:
    name: test-unit
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f poetry.lock ]; then
            python -m pip install poetry
            poetry install --no-interaction
          elif [ -f uv.lock ]; then
            python -m pip install uv
            uv sync
          else
            echo "No dependency lock/requirements yet; skipping installs."
          fi

      - name: Run unit pytest
        run: |
          set -euo pipefail
          if ! command -v pytest >/dev/null 2>&1; then
            echo "pytest not installed; skipping unit tests until deps exist."
            exit 0
          fi
          if [ ! -f tests/test_result_store.py ]; then
            echo "tests/test_result_store.py not present; skipping unit test job (noop)."
            exit 0
          fi
          # Application unit tests only — no Playwright browser install, no network.
          pytest tests/test_result_store.py

  browser-site-report:
    name: browser-site-report
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f poetry.lock ]; then
            python -m pip install poetry
            poetry install --no-interaction
          elif [ -f uv.lock ]; then
            python -m pip install uv
            uv sync
          else
            echo "No dependency lock/requirements yet; skipping installs."
          fi

      - name: Install Playwright browsers
        run: |
          set -euo pipefail
          if ! command -v playwright >/dev/null 2>&1; then
            echo "playwright not installed; skipping browser install until deps exist."
            exit 0
          fi
          playwright install --with-deps chromium firefox webkit

      - name: Run Playwright site-report suite
        run: |
          set -euo pipefail
          if ! command -v pytest >/dev/null 2>&1; then
            echo "pytest not installed; skipping browser suite until deps exist."
            exit 0
          fi
          mapfile -t test_files < <(find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) \
            ! -path './.git/*' ! -path './.venv/*' ! -path './venv/*' | head -n 20)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No pytest files yet; skipping browser job (noop until the suite lands)."
            exit 0
          fi
          export BASE_URL="${BASE_URL:-https://www.kubozoa.com/}"
          pytest

      # Upload when present (Issue #13 / #11 contract); ignore if missing.
      # if: always() so a red pytest run still uploads results/latest.json when written.
      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-results
          path: results/latest.json
          if-no-files-found: ignore
